<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Native project-entry preview fixture</title>
<style>body{margin:14px;font:14px system-ui,sans-serif;background:#f5f7f6;color:#172d25}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:8px 11px}#native-mode{font-family:monospace;color:#176040}main{display:grid;grid-template-columns:47% 53%;height:65vh;margin-top:12px;gap:8px}#editor{overflow:auto;border:1px solid #aaa;background:white}.cm-editor{min-height:100%}iframe{width:100%;height:100%;border:1px solid #aaa;background:white}.diagnostics{display:grid;grid-template-columns:1fr 1fr;gap:10px}pre{white-space:pre-wrap;word-break:break-word;overflow:auto;height:19vh;background:#e8eeeb;padding:8px;margin-bottom:0}#bridge-status,#preview-status{display:block;margin-top:6px}</style>
<header><button id="run-retirement-matrix">Run capture-retirement regression</button><button id="run-retained-matrix">Run retained-location matrix</button><button id="download-retained" disabled>Download retained receipt</button><button id="run-multi-body-matrix">Run six-body matrix</button><button id="run-window-matrix">Run body-window matrix</button><button id="run-matrix">Run location/delete matrix</button><button id="download-matrix" disabled>Download matrix receipt</button><button id="insert-paragraph">插入新段落</button><button id="insert-formula">插入新公式</button><button id="type-formula">逐字输入公式（60 ms）</button><button id="delete-insertion">删除本次新增段落/公式</button><button id="type-more">修改已有段落</button><button id="go-distant">光标跳到远处</button><button id="go-first">光标回到首页</button><button id="stop">停止桥接</button></header>
<div><label for="math-scenario">分阶段公式场景：</label><select id="math-scenario"><option value="dollar-sequential">$ sequential</option><option value="double-dollar-sequential">$$ sequential</option><option value="bracket-sequential">\[ sequential</option><option value="paired-fill">paired $$ fill mathbb</option><option value="equation-sequential">equation sequential</option><option value="equation-paired">equation paired shell</option><option value="equation-aligned-sequential">equation+aligned sequential</option><option value="equation-aligned-paired">equation+aligned paired shell</option></select> <button id="run-paced-math">运行分阶段公式（450 ms）</button></div>
<div><label for="text-break-mode">连续文本：</label><select id="text-break-mode"><option value="blank-line">空行分段（五段：先回车再提交汉字）</option></select> <select id="text-cadence"><option value="100">100 ms</option><option value="450">450 ms</option><option value="1000">1000 ms</option></select> <button id="run-text-sequence">连续输入五段你好</button></div>
<div id="retained-status" role="status">Retained matrix not started.</div><div id="matrix-status" role="status">Location/delete matrix not started.</div><div id="typing-status" role="status">合成逐字输入尚未开始；不代表操作系统输入法测试。</div><div id="deletion-status" role="status">仅可删除本页面控件新增且仍完整的内容。</div><div id="native-mode">Source mode: binding</div><span id="bridge-status">等待真实项目桥接</span><span id="preview-status">等待真实预览</span>
<main><div id="editor" aria-label="Synthetic CodeMirror source"></div><iframe id="preview" title="Actual rtex browser canvas" src="about:blank"></iframe></main><pre id="retained-result" aria-label="Retained location matrix receipt" style="height:auto;max-height:26vh"></pre><pre id="matrix-result" aria-label="Location and deletion matrix receipt" style="height:auto;max-height:26vh"></pre>
<div class="diagnostics"><pre id="metrics" aria-label="Actual preview metrics"></pre><pre id="log" aria-label="Native and project-entry events"></pre></div>
<pre id="typing-result" aria-label="Exact final typing source and acknowledgment result" style="height:auto;max-height:22vh"></pre><pre id="deletion-result" aria-label="Exact deletion acknowledgment and source parity" style="height:auto;max-height:22vh"></pre><pre id="sequence-trace" aria-label="Per-revision source acknowledgments and preview timing trace" style="height:auto;max-height:28vh"></pre><p>仅本机合成文档。编辑器事务由原生观察器与实际 project-entry 控制器转发；此页面不连接 NAS。</p><script type="module" src="/client.js"></script></html>
