name: Bug report
description: Report a reproducible integration issue
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Integration version, pinned Overleaf image, engine version, OS/browser, compiler and input method.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Use a small synthetic document. Say whether this is an existing paragraph, a new paragraph, a formula, deletion or page crossing.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Distinguish engine time from input-to-preview time. Include a redacted diagnostic receipt if useful; keep private papers and credentials out of the issue.
    validations:
      required: true
